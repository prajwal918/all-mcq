name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Tests & Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        continue-on-error: true
        uses: actions/checkout@v7

      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Validate JSON Data Format
        continue-on-error: true
        run: |
          # Use jq to ensure the questions file is valid JSON
          jq empty all_questions.json
          
      - name: Lint HTML Structure
        continue-on-error: true
        run: |
          npx --yes htmlhint "index.html"
          
      - name: Verify Application Files Exist
        continue-on-error: true
        run: |
          test -f index.html
          test -f all_questions.json

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
